<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">

<title>Super JinX</title>

  "username": (user.username|string),
  "status": (user.status.value if user.status.value is defined else user.status|string),
  "used": ((user.used_traffic or 0)|int),
  "limit": ((user.data_limit or 0)|int),
  "expire": (((user.expire.timestamp()|int) if user.expire.timestamp is defined else (user.expire|int)) if user.expire else 0),
  "links": (links or []),
  "announce": announce or ""
} | tojson }}</script>
{% raw %}
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
@font-face{font-family:Vazirmatn;src:url(https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn[wght].woff2) format("woff2-variations");font-weight:100 900;font-display:swap}
@property --a{syntax:"<angle>";inherits:true;initial-value:0deg}
:root{--ink:#05060c;--card:rgba(17,20,40,.72);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--text:#f5f7ff;--muted:#949cb8;--c1:#22d3ee;--c2:#4f7bff;--c3:#a855f7;--c4:#f472b6;--ok:#2ee59d;--warn:#ffb547;--bad:#ff5f6d;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:Vazirmatn,"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
body{min-height:100dvh;padding:max(14px,env(safe-area-inset-top)) 14px calc(100px + env(safe-area-inset-bottom));overflow-x:hidden}
body.lock{overflow:hidden}
button,a{font:inherit;color:inherit}a{text-decoration:none}svg{display:block}button{-webkit-user-select:none;user-select:none}
.ltr{direction:ltr;unicode-bidi:isolate}
.hide{display:none!important}
/* background: GPU-cheap (no blur filter, no backdrop on cards) */
.aur{position:fixed;inset:-10%;z-index:-2;pointer-events:none;background:radial-gradient(42% 34% at 82% 8%,rgba(79,123,255,.42),transparent 70%),radial-gradient(36% 30% at 8% 32%,rgba(168,85,247,.34),transparent 70%),radial-gradient(42% 34% at 62% 92%,rgba(34,211,238,.2),transparent 70%);will-change:transform;animation:aur 20s ease-in-out infinite alternate}
@keyframes aur{to{transform:translate3d(0,3%,0) rotate(6deg) scale(1.06)}}
#fx{position:fixed;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none}
/* splash: hides itself even if scripts fail */
.splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--ink);animation:spOut .5s 1.6s var(--ease) forwards}
.splash.out{animation:spOut .45s var(--ease) forwards}
@keyframes spOut{to{opacity:0;visibility:hidden}}
.splash .sl{width:84px;height:84px;border-radius:28px;display:grid;place-items:center;position:relative;animation:pop .8s var(--spring) both}
.splash .sl::before{content:"";position:absolute;inset:-2px;border-radius:30px;background:conic-gradient(from 0deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c1));animation:spin 1.4s linear infinite}
.splash .sl::after{content:"";position:absolute;inset:2px;border-radius:26px;background:#0a0c18}
.splash .sl svg{position:relative;z-index:1}
.splash b{display:block;text-align:center;margin-top:18px;letter-spacing:6px;font-size:13px;color:var(--muted);animation:fade .8s .2s both}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pop{from{transform:scale(.4);opacity:0}}@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.js .rv{opacity:0;transform:translate3d(0,20px,0)}
.rv{transition:opacity .7s var(--ease),transform .7s var(--ease)}
.js .rv.on{opacity:1;transform:none}
.card{position:relative;border-radius:26px;padding:16px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015)),var(--card);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 24px 50px -24px rgba(0,0,0,.7)}
/* top */
.top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.mk{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;position:relative;background:#0a0c18;box-shadow:0 0 0 1px var(--line2),0 10px 26px rgba(79,123,255,.4)}
.bn b{display:block;font-size:17px;font-weight:900;letter-spacing:.4px;background:linear-gradient(90deg,#fff 20%,#b6c3ff,#e3b8ff,#fff 80%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.bn span{font-size:11.5px;color:var(--muted)}
.seg{position:relative;display:flex;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:3px;direction:ltr}
.seg button{position:relative;z-index:1;border:0;background:none;width:44px;padding:6px 0;font-size:12px;font-weight:800;cursor:pointer;color:var(--muted);transition:color .3s}
.seg button.on{color:#fff}
.seg i{position:absolute;top:3px;bottom:3px;left:3px;width:44px;border-radius:999px;background:linear-gradient(135deg,var(--c2),var(--c3));box-shadow:0 4px 14px rgba(79,123,255,.45);transition:transform .45s var(--spring)}
/* pass */
.passw{perspective:1000px}
.pass{position:relative;border-radius:28px;padding:20px;min-height:208px;overflow:hidden;transition:transform .3s ease-out;will-change:transform;
 background:radial-gradient(120% 120% at 0% 0%,#2a3cff 0%,transparent 45%),radial-gradient(120% 120% at 100% 100%,#9b2cff 0%,transparent 50%),linear-gradient(135deg,#0d1236,#1a0d36);
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 34px 70px -26px rgba(79,60,255,.6),0 20px 40px -20px rgba(0,0,0,.8);animation:holo 9s linear infinite}
@keyframes holo{to{--a:360deg}}
.pass::before{content:"";position:absolute;inset:0;background:conic-gradient(from var(--a) at var(--x,30%) var(--y,30%),transparent,rgba(34,211,238,.28),rgba(244,114,182,.24),transparent 40%);mix-blend-mode:screen;opacity:.5;pointer-events:none}
.pass::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:60%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.2),transparent);transform:translate3d(-100%,0,0);animation:gl 6s 1.8s ease-in-out infinite;pointer-events:none}
@keyframes gl{0%,55%{transform:translate3d(-100%,0,0)}100%{transform:translate3d(420%,0,0)}}
.pass .dots{position:absolute;inset:0;opacity:.16;background-image:radial-gradient(rgba(255,255,255,.6) 1px,transparent 1px);background-size:14px 14px;-webkit-mask-image:linear-gradient(120deg,#000,transparent 60%);mask-image:linear-gradient(120deg,#000,transparent 60%);pointer-events:none}
.pass>*{position:relative;z-index:1}
.pr{display:flex;justify-content:space-between;align-items:flex-start;direction:ltr}
.pr .t{font-size:11px;letter-spacing:4px;font-weight:800;opacity:.8}
.pr .t b{display:block;font-size:20px;letter-spacing:1px;margin-top:4px;font-weight:900}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:11.5px;font-weight:800;background:rgba(46,229,157,.14);color:var(--ok);border:1px solid rgba(46,229,157,.35)}
html[dir=rtl] .badge{direction:rtl}
.badge i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pu 1.8s infinite}
.badge.warn{color:var(--warn);background:rgba(255,181,71,.14);border-color:rgba(255,181,71,.35)}
.badge.bad{color:var(--bad);background:rgba(255,95,109,.14);border-color:rgba(255,95,109,.35)}
.badge.hold{color:#8ab4ff;background:rgba(79,123,255,.14);border-color:rgba(79,123,255,.35)}
@keyframes pu{0%{box-shadow:0 0 0 0 currentColor}70%,100%{box-shadow:0 0 0 8px transparent}}
.emb{margin:20px 0 14px;display:flex;align-items:center;gap:12px;direction:ltr}
.seal{position:relative;width:48px;height:48px;flex:none;border-radius:50%;display:grid;place-items:center}
.seal .sr{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from var(--a),#67e8f9,#818cf8,#f0abfc,#fde68a,#67e8f9);box-shadow:0 0 20px rgba(129,140,248,.6)}
.seal .sr::after{content:"";position:absolute;inset:3px;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.16) 0 6deg,transparent 6deg 12deg),#0b0e22}
.seal .sc{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#2a2f66,#0b0e22);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.sx b{display:flex;align-items:center;gap:5px;font-size:11px;letter-spacing:2.5px;font-weight:900;color:#a7f3d0}
.sx span{display:block;font-size:10.5px;letter-spacing:1.5px;color:rgba(255,255,255,.6);margin-top:4px}
.wave{margin-left:auto;display:flex;gap:3px;align-items:center;height:26px}
.wave i{width:3px;height:100%;border-radius:3px;background:linear-gradient(#67e8f9,#a78bfa);transform-origin:center;animation:wv 1.2s ease-in-out infinite}
.wave i:nth-child(1){transform:scaleY(.3)}.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}.wave i:nth-child(5){animation-delay:.6s}
@keyframes wv{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.uname{font-size:24px;font-weight:900;letter-spacing:.5px;text-shadow:0 2px 18px rgba(120,140,255,.55);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:left}
.pf{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:10px}
.pf small{display:block;font-size:10.5px;color:rgba(255,255,255,.65)}
.pf b{display:block;font-size:14.5px;margin-top:2px}
/* notes */
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:18px;font-size:13px;line-height:1.8;border:1px solid}
.note svg{flex:none;margin-top:3px}
.note.warn{background:rgba(255,181,71,.1);border-color:rgba(255,181,71,.3);color:#ffd9a0}
.note.bad{background:rgba(255,95,109,.1);border-color:rgba(255,95,109,.3);color:#ffc2c8}
.note.info{background:rgba(79,123,255,.1);border-color:rgba(79,123,255,.3);color:#cdd8ff;white-space:pre-line}
/* usage */
.use{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tk{stroke:rgba(255,255,255,.07)}
.ring .br{stroke:url(#gr);stroke-linecap:round;stroke-dasharray:326.73;stroke-dashoffset:326.73;transition:stroke-dashoffset 1.6s var(--ease)}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .mid b{font-size:26px;font-weight:900;line-height:1}
.ring .mid small{display:block;font-size:10.5px;color:var(--muted);margin-top:5px}
.us{flex:1;min-width:0;display:grid;gap:8px}
.ur{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.ur b{color:var(--text);font-size:14px;white-space:nowrap}
.ur .d{width:8px;height:8px;border-radius:50%;display:inline-block;margin-inline-end:7px;vertical-align:middle}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:100%;border-radius:9px;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3));transform:scaleX(0);transform-origin:left;transition:transform 1.6s var(--ease)}
html[dir=rtl] .bar i{transform-origin:right}
/* heads */
.h{display:flex;align-items:center;gap:9px;font-weight:900;font-size:15px;margin:0 0 13px}
.h .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(79,123,255,.3),rgba(168,85,247,.3));box-shadow:inset 0 0 0 1px rgba(168,85,247,.4);color:#dfe3ff;flex:none}
.h .sp{flex:1}
.h small{font-size:11.5px;color:var(--muted);font-weight:600}
/* ping */
.ping{display:flex;align-items:center;gap:14px}
.rad{position:relative;width:62px;height:62px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:color .4s}
.rad::before,.rad::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid currentColor;opacity:0;animation:rd 2.2s ease-out infinite}
.rad::after{animation-delay:1.1s}
.rad span{position:absolute;inset:8px;border-radius:50%;background:currentColor;opacity:.14}
@keyframes rd{0%{transform:scale(.5);opacity:.8}100%{transform:scale(1.3);opacity:0}}
.rad b{position:relative;font-size:11px;font-weight:900;letter-spacing:1px}
.pv{flex:1;min-width:0}
.pv .n{font-size:30px;font-weight:900;line-height:1}
.pv .n small{font-size:13px;color:var(--muted);font-weight:700;margin-left:4px}
.pv .q{font-size:12px;color:var(--muted);margin-top:6px}
.sig{display:flex;gap:3px;align-items:flex-end;height:18px}
.sig i{width:5px;border-radius:2px;background:rgba(255,255,255,.12);transition:background .4s}
.spin svg{animation:spin .9s linear infinite}
/* link */
.lk{display:flex;align-items:center;gap:8px;padding:6px;border-radius:17px;background:rgba(0,0,0,.35);border:1px solid var(--line);direction:ltr}
.lk code{flex:1;min-width:0;padding-left:10px;font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#c5cdff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{position:relative;overflow:hidden;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 15px;border-radius:13px;font-weight:800;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--c2),var(--c3));box-shadow:0 8px 20px -8px rgba(110,90,255,.8),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .2s var(--spring),filter .2s;touch-action:manipulation}
.btn:active{transform:scale(.95)}
.btn.gh{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ok{background:linear-gradient(135deg,#10b981,#2ee59d)}
.btn .rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.qrw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.qrw.on{grid-template-rows:1fr}
.qrw>div{overflow:hidden;min-height:0}
.qr{margin:14px auto 4px;width:216px;max-width:100%;padding:12px;border-radius:22px;background:#fff;position:relative;box-shadow:0 0 0 6px rgba(255,255,255,.06),0 18px 44px -12px rgba(79,123,255,.55)}
.qr canvas{width:100%;height:auto;display:block;image-rendering:pixelated}
.qr .lg{position:absolute;left:50%;top:50%;width:19%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:28%;background:#0a0c18;display:grid;place-items:center;box-shadow:0 0 0 4px #fff}
.qr .lg svg{width:58%;height:58%}
/* apps */
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding-top:4px}
.app{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:12.5px;font-weight:800;transition:transform .25s var(--spring);touch-action:manipulation}
.app:active{transform:scale(.94)}
.app .ai{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;font:900 15px system-ui,-apple-system,sans-serif;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 18px -8px rgba(0,0,0,.8)}
.app.rec{background:linear-gradient(#121530,#121530) padding-box,linear-gradient(135deg,var(--c1),var(--c3),var(--c4)) border-box;border:1.5px solid transparent}
.app .tag{position:absolute;top:-9px;font-size:10px;font-weight:800;padding:2px 9px;border-radius:999px;background:linear-gradient(135deg,var(--c2),var(--c4));box-shadow:0 4px 12px rgba(168,85,247,.55);white-space:nowrap}
/* configs */
.cf{position:relative;display:flex;align-items:center;gap:8px;padding:11px 10px;border-radius:18px;background:rgba(255,255,255,.035);border:1px solid var(--line);margin-bottom:9px;overflow:hidden}
.cf:last-child{margin-bottom:0}
.cf::before{content:"";position:absolute;top:12px;bottom:12px;inset-inline-start:0;width:3px;border-radius:3px;background:var(--ac)}
.cf .ix{width:36px;height:36px;flex:none;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);color:var(--ac)}
.cf .nm{flex:1;min-width:0}
.cf .nm b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext;text-align:start}
.cf .tg2{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.cf .tg2 span{flex:none;font-size:10px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--muted);direction:ltr;white-space:nowrap}
.cf .tg2 .crown{font-weight:900;letter-spacing:1px;background:linear-gradient(135deg,#ffd27a,#f59e0b);color:#2a1700}
.cf.pro{background:linear-gradient(120deg,rgba(255,196,87,.13),rgba(168,85,247,.09) 60%,rgba(255,255,255,.03));border-color:rgba(255,196,87,.35)}
.cp{width:35px;height:35px;flex:none;border-radius:11px;border:0;cursor:pointer;display:grid;place-items:center;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px var(--line);transition:transform .2s var(--spring),background .3s,color .3s;touch-action:manipulation}
.cp:active{transform:scale(.9)}
.cp.ok{background:rgba(46,229,157,.16);color:var(--ok);box-shadow:inset 0 0 0 1px rgba(46,229,157,.4)}
.empty{text-align:center;color:var(--muted);font-size:13px;line-height:1.9;padding:14px 6px}
/* help */
details{border-top:1px solid var(--line);padding:13px 2px}
details:first-of-type{border-top:0;padding-top:2px}
summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;font-weight:800;font-size:13.5px}
summary::-webkit-details-marker{display:none}
summary .n{width:24px;height:24px;flex:none;border-radius:8px;display:grid;place-items:center;font-size:11.5px;background:rgba(255,255,255,.07)}
summary .ar{margin-inline-start:auto;flex:none;transition:transform .35s var(--spring)}
details[open] summary .ar{transform:rotate(180deg)}
.dc{font-size:13px;line-height:2;color:#cfd5ea;padding-top:8px;padding-inline-start:34px}
.dc code{direction:ltr;unicode-bidi:isolate;font-size:11.5px;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.08);word-break:break-all}
/* telegram */
.tgc{display:flex;align-items:center;gap:13px;padding:16px;border-radius:24px;background:linear-gradient(135deg,#2aabee,#1d6fe0 60%,#5b4bff);box-shadow:0 18px 36px -16px rgba(42,171,238,.7),inset 0 1px 0 rgba(255,255,255,.3);position:relative;overflow:hidden}
.tgc::after{content:"";position:absolute;top:0;bottom:0;left:-50%;width:50%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.22),transparent);transform:translate3d(-100%,0,0);animation:gl2 5s 2s ease-in-out infinite;pointer-events:none}
@keyframes gl2{0%,50%{transform:translate3d(-100%,0,0)}100%{transform:translate3d(400%,0,0)}}
.tgc .ti{width:46px;height:46px;flex:none;border-radius:15px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.tgc b{display:block;font-size:15px;font-weight:900}.tgc small{font-size:12px;opacity:.9}
.tgc .go{margin-inline-start:auto;flex:none}
html[dir=rtl] .fl{transform:scaleX(-1)}
.foot{text-align:center;font-size:11.5px;color:var(--muted);padding:6px 0 4px;direction:ltr}
.foot b{font-weight:900;background:linear-gradient(90deg,#9db4ff,#e3b8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:14px 14px max(14px,env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(5,6,12,.96) 45%,rgba(5,6,12,0));transform:translate3d(0,120%,0);transition:transform .6s var(--spring);pointer-events:none}
.dock.on{transform:none}
.dock .btn{pointer-events:auto;width:100%;max-width:460px;margin:0 auto;display:flex;padding:15px;border-radius:18px;font-size:15px;background:linear-gradient(135deg,var(--c1),var(--c2) 45%,var(--c3));box-shadow:0 12px 30px -10px rgba(79,123,255,.9),inset 0 1px 0 rgba(255,255,255,.35)}
/* sheet (config QR) */
